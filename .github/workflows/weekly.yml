name: Weekly Patch Briefing
on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday, 12:00 UTC
  workflow_dispatch:        # lets you press a "Run" button manually
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
      - name: Commit the new report
        run: |
          git config user.name "patchparliament-bot"
          git config user.email "patchparliament-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "Weekly patch briefing"
          git push
